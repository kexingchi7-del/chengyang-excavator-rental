<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>佳和盛达｜租赁经营台账</title><link rel="stylesheet" href="admin.css"></head><body><main>
<nav><a href="./">← 首页</a><a href="strategy.html">预付与成本测算</a><a href="guide.html">独立运行指南</a></nav><h1>租赁经营台账</h1><p>实际到账、已确认工时、余额与补款。柴油由客户提供，不计入租金。</p>
<aside>数据只保存在当前浏览器，不上传、不自动跨设备同步。关闭页面后不会发提醒。请定期导出备份；云端归档与定时提醒按运行指南启用。</aside><section class="metrics" id="metrics"></section>
<section><h2>新建 / 更新订单</h2><form id="orderForm"><div class="grid">
<label>合同编号<input name="id" required maxlength="100"></label><label>客户 / 公司<input name="customer" required maxlength="120"></label>
<label>机型<select name="machine"><option value="972">柳工972</option><option value="965">柳工965</option><option value="6500">临工6500</option></select></label><label>合同小时价（元）<input name="rate" type="number" min="0.01" max="100000" step="0.01" value="800" required></label>
<label>累计已确认台时<input name="actualHours" type="number" min="0" max="1000000" step="0.01" value="0" required></label><label>累计实际到账（元）<input name="paid" type="number" min="0" max="100000000" step="0.01" value="0" required></label>
<label>其他确认应收费用（元）<input name="extras" type="number" min="0" max="100000000" step="0.01" value="0" required></label><label>预计每天合计台时<input name="dailyHours" type="number" min="0.5" max="2400" step="0.5" value="8" required></label>
</div><p>台时为各设备工时之和。转账截图不等于到账；抵扣费用须经双方确认。</p><button>保存订单</button><button type="button" id="reset">清空表单</button></form></section>
<section><h2>余额与跟进</h2><div id="orders"></div><p id="status" role="status"></p></section>
<section><h2>备份与恢复</h2><button id="export">导出完整备份</button><label>合并导入备份<input id="import" type="file" accept="application/json,.json"></label><p>导入时保留本地同编号订单。迁移到其他设备前先导出。</p></section>
</main><script src="business.js"></script><script src="admin.js"></script></body></html>
